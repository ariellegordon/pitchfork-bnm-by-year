name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC: pick up last week's Best New Music
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # don't kill a scrape halfway through its commit

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit refreshed data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Scheduled and manual runs fetch new picks; plain pushes just redeploy.
      - name: Scrape new Best New Music
        if: github.event_name != 'push'
        run: npm run scrape
      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git add public/data/albums.json
          if git diff --cached --quiet; then
            echo "No new picks."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Best New Music data"
            git push
          fi

      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
